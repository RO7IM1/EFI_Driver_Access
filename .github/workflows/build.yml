name: Build EFI Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/upload-artifact@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential gnu-efi

    - name: Build Driver
      run: |
        cd CRZEFI
        make

    - name: Upload EFI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: memory-efi-file
        path: CRZEFI/*.efi
